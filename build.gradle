plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    // YACL & ModMenu GUI Integration (optional/compile-time only)
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}


processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

loom {
    mixin {
        defaultRefmapName = "ore-amplifier-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Automatically copies built release JAR to central Archive directory and Modrinth profile'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (!jarFile.exists()) {
                    jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
                }
                if (jarFile.exists()) {
                    // 1. Central Versioned Archive
                    def archiveDir = file("../Archive Jar of all versions/MC 26.2")
                    archiveDir.mkdirs()
                    copy {
                        from jarFile
                        into archiveDir
                    }
                    println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.canonicalPath}"

                    // 2. Modrinth Profile Sync (if directory exists)
                    def targetProfiles = [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.2 (1)/mods"),
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.x test the latest/mods")
                    ]
                    targetProfiles.each { modrinthProfileMods ->
                        if (modrinthProfileMods.exists()) {
                            modrinthProfileMods.listFiles().each { f ->
                                if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
                                    f.delete()
                                    println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
                                }
                            }
                            copy {
                                from jarFile
                                into modrinthProfileMods
                            }
                            println "[MODRINTH-SYNC] Deployed ${jarFile.name} to Modrinth profile mods folder: ${modrinthProfileMods.canonicalPath}"
                        }
                    }
                }
            }
        }

        tasks.named('build').configure {
            finalizedBy archiveTask
        }
    }
}
