plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.hasProperty('loader_version') ? project.loader_version : project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "net.fabricmc.fabric-api:fabric-permission-api-v1:1.0.0+5f4a394125"

    implementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    // YACL & ModMenu GUI Integration (optional/compile-time only)
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Testing
    testImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", (project.hasProperty('loader_version') ? project.loader_version : project.fabric_loader_version)
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": (project.hasProperty('loader_version') ? project.loader_version : project.fabric_loader_version),
               "minecraft_version": project.minecraft_version
    }
}

loom {
    mixin {
        defaultRefmapName = "ore-amplifier-refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes(
            'Implementation-Title': project.archives_base_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor': 'Dasik (Rifaditya)',
            'X-Origin-Author': 'Dasik (Rifaditya)',
            'X-Origin-Repository': 'https://github.com/Rifaditya',
            'X-Origin-License': 'GNU GPLv3'
        )
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Automatically copies built release JAR to central Archive directory, external vault, and Modrinth profile'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (!jarFile.exists()) {
                    jarFile = file("build/libs/${project.archives_base_name}-${project.mod_version}.jar")
                }
                if (jarFile.exists()) {
                    def mcVer = project.hasProperty('minecraft_version') ? project.minecraft_version.toString() : ""
                    def targetSubdir = mcVer.startsWith("26.3") ? "MC 26.3" :
                                       mcVer.startsWith("26.2") ? "MC 26.2" :
                                       mcVer.startsWith("26.1") ? "MC 26.1.2" :
                                       mcVer.startsWith("1.21.11") ? "MC 1.21.11" :
                                       mcVer.startsWith("1.21") ? "MC 1.21.1" :
                                       mcVer.startsWith("1.20") ? "MC 1.20.1" : "MC Unknown"

                    // 1. Subproject local archive
                    def subprojectArchive = file("../Archive Jar of all versions/${targetSubdir}")
                    subprojectArchive.mkdirs()
                    copy {
                        from jarFile
                        into subprojectArchive
                    }
                    println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to subproject Archive directory: ${subprojectArchive.canonicalPath}"

                    // 1b. Root Collection Archive
                    def collectionArchive = file("../../Archive Jar of all versions/${targetSubdir}")
                    collectionArchive.mkdirs()
                    copy {
                        from jarFile
                        into collectionArchive
                    }
                    println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to root collection Archive directory: ${collectionArchive.canonicalPath}"

                    // 2. Modrinth Profile Sync
                    def targetProfiles = mcVer.startsWith("26.3") ? [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3ish/mods")
                    ] : mcVer.startsWith("26.2") ? [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.2 (1)/mods"),
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.x test the latest/mods")
                    ] : mcVer.startsWith("26.1") ? [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.1.2/mods")
                    ] : mcVer.startsWith("1.21.11") ? [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.21.11/mods")
                    ] : mcVer.startsWith("1.21") ? [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.21.1/mods")
                    ] : mcVer.startsWith("1.20") ? [
                        file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.20.1/mods")
                    ] : []

                    targetProfiles.each { modrinthProfileMods ->
                        if (modrinthProfileMods.exists()) {
                            modrinthProfileMods.listFiles().each { f ->
                                if (f.name.startsWith(project.archives_base_name) && f.name.endsWith(".jar") && f.name != jarFile.name) {
                                    f.delete()
                                    println "[MODRINTH-SYNC] Purged old version from launcher profile: ${f.name}"
                                }
                            }
                            copy {
                                from jarFile
                                into modrinthProfileMods
                            }
                            println "[MODRINTH-SYNC] Deployed ${jarFile.name} to Modrinth profile mods folder: ${modrinthProfileMods.canonicalPath}"
                        }
                    }

                    // 3. Central Release Hub Archives Sync
                    File hubCandidate = projectDir
                    File hubDir = null
                    while (hubCandidate != null) {
                        File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
                        if (checkDir.exists()) {
                            hubDir = checkDir
                            break
                        }
                        hubCandidate = hubCandidate.parentFile
                    }
                    if (hubDir == null) {
                        File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
                        if (fallback.exists()) hubDir = fallback
                    }
                    if (hubDir != null && hubDir.exists()) {
                        File hubConfigFile = new File(hubDir, "config/platform_projects.json")
                        if (hubConfigFile.exists()) {
                            try {
                                def hubJson = new groovy.json.JsonSlurper().parse(hubConfigFile)
                                def curPath = projectDir.canonicalPath.replace('\\', '/').toLowerCase()
                                def matchedMod = hubJson.find { name, data ->
                                    data.root_dir && curPath.contains(data.root_dir.replace('\\', '/').toLowerCase())
                                }?.key
                                if (matchedMod) {
                                    File targetArchiveDir = new File(hubDir, "archives/${matchedMod}")
                                    if (!targetArchiveDir.exists()) {
                                        targetArchiveDir.mkdirs()
                                    }
                                    def targetFileToCopy = (tasks.findByName('remapJar') ?: tasks.findByName('jar')).archiveFile.get().asFile
                                    copy {
                                        from targetFileToCopy
                                        into targetArchiveDir
                                    }
                                    println "[HUB-ARCHIVE] Successfully copied ${targetFileToCopy.name} to release hub archives: ${targetArchiveDir.canonicalPath}"
                                }
                            } catch (Exception e) {
                                println "[HUB-ARCHIVE] Note: Could not copy to release hub: ${e.message}"
                            }
                        }
                    }

                    // 4. External Vault Sync (D: Drive)
                    File externalVault = new File("D:/Minecraft Mod Archive Jars/Ore Amplifier")
                    if (externalVault.exists()) {
                        copy {
                            from jarFile
                            into externalVault
                        }
                        println "[EXTERNAL-VAULT] Successfully copied ${jarFile.name} to external vault: ${externalVault.canonicalPath}"
                    }
                }
            }
        }

        tasks.named('build').configure {
            finalizedBy archiveTask
        }
    }
}
